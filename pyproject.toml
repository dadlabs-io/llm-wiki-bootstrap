[project]
name = "llm-wiki-tooling"
version = "0.1.0"
description = "The environment the llm-wiki scripts and hooks run in: the installer copies this file, uv.lock and .python-version beside the scripts and builds it with uv sync --locked."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.177",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.3",
    "markitdown[all]>=0.1.8",
    "pypdf>=6.14",
    "pyyaml>=6.0",
    "requests>=2.32",
    "yt-dlp>=2026.3.17",
    # local speech-to-text for media without captions (wiki-transcribe.py, 2026-10-05); av 16+ breaks faster-whisper 1.2.1
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.6",  # imported directly: the CUDA device count
    "av>=15,<16",
    "playwright>=1.55",
]

[project.optional-dependencies]
# CUDA 12 cuBLAS + cuDNN 9 for faster-whisper on an NVIDIA GPU (~1 GB): the installer adds --extra gpu only where
# nvidia-smi answers. They sit beside a system CUDA 13 without conflict (tested 2026-10-05).
gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.uv]
package = false
