[project]
name = "llm-wiki-tooling"
version = "0.1.0"
description = "The environment the llm-wiki scripts and hooks run in: the installer copies this file, uv.lock and .python-version beside the scripts and builds it with uv sync --locked."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.177",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.3",
    "pypdf>=6.14",
    "pyyaml>=6.0",
    "requests>=2.32",
    "yt-dlp>=2026.3.17",
]

[tool.uv]
package = false
